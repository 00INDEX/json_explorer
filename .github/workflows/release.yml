name: Release

# Publish to Open VSX (and the VS Code Marketplace, if configured) whenever a
# version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   OVSX_PAT  – Open VSX access token (https://open-vsx.org → Settings → Access Tokens)
#   VSCE_PAT  – (optional) Azure DevOps PAT with Marketplace→Manage scope. If unset,
#               the VS Code Marketplace step is skipped automatically.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package -o json-explorer.vsix

      - name: Ensure Open VSX namespace exists
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx create-namespace 00index -p "$OVSX_PAT" || true

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish json-explorer.vsix -p "$OVSX_PAT"

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath json-explorer.vsix -p "$VSCE_PAT" --skip-duplicate

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: json-explorer.vsix
